# Serves the built SPA. Unknown paths fall back to index.html so client-side routes work on reload.
#
# Content-Security-Policy: scripts and styles only from this origin (the build has no inline code);
# API calls only to the configured service origins (the placeholder in connect-src is filled in at image build time
# from the same VITE_*_API_URL values baked into the bundle); images from any https origin (product
# images are external URLs). No framing, no plugins, no foreign form targets.
#
# nginx does not inherit add_header into a location that declares its own, so every location
# includes the full header set.
map $uri $csp {
  default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' __CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location /assets/ {
    # Vite fingerprints asset filenames, so they can be cached forever.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    try_files $uri $uri/ /index.html;
  }
}
