name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: No high or critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Generated API types match the pinned contracts
        run: npm run contracts:types && git diff --exit-code src/api/generated
      - name: Typecheck (includes the compile-time contract check, src/api/contract-check.ts)
        run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed until Phase 7)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ecommerce-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
